<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Antecipa — o seu IRS, um ano antes da hora</title>
  <meta name="description" content="Antecipa: simulação de IRS alinhada com a fórmula oficial, mês a mês, um ano antes da campanha de entrega." />
  <meta name="theme-color" content="#0B1D3A" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-header__row">
        <!-- Variante "sobre escuro": a calculadora usa o azul em vez do
             navy-deep, senão desaparece contra o fundo --navy-deep do
             cabeçalho (ver secção 4 do BRAND.md). -->
        <svg class="brand-mark" viewBox="0 0 100 100" role="img" aria-label="Antecipa">
          <path d="M20,26 Q9,50 20,74" fill="none" stroke="#5B8DD9" stroke-width="6" stroke-linecap="round"/>
          <path d="M80,26 Q91,50 80,74" fill="none" stroke="#5B8DD9" stroke-width="6" stroke-linecap="round"/>
          <rect x="29" y="46" width="42" height="34" rx="7" fill="#1F4E9E"/>
          <g fill="#FFFFFF">
            <rect x="35" y="56" width="8" height="8" rx="2"/>
            <rect x="46" y="56" width="8" height="8" rx="2"/>
            <rect x="57" y="56" width="8" height="8" rx="2"/>
            <rect x="35" y="68" width="8" height="8" rx="2"/>
            <rect x="46" y="68" width="8" height="8" rx="2"/>
            <rect x="57" y="68" width="8" height="8" rx="2"/>
          </g>
          <path d="M35,17 H60 L68,25 V56 A4,4 0 0 1 64,60 H35 A4,4 0 0 1 31,56 V21 A4,4 0 0 1 35,17 Z" fill="#FFFFFF" stroke="#0B1D3A" stroke-width="2.5"/>
          <path d="M60,17 L68,25 H60 Z" fill="#5B8DD9"/>
          <text x="49.5" y="35" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="13" fill="#0B1D3A" text-anchor="middle">IRS</text>
          <line x1="38" y1="42" x2="58" y2="42" stroke="#5B8DD9" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="38" y1="48" x2="52" y2="48" stroke="#5B8DD9" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <span class="brand-wordmark">antecipa</span>
      </div>
    </header>

    <main class="app-main" id="main-view" aria-live="polite"></main>

    <nav class="bottom-nav" id="bottom-nav" hidden>
      <button class="bottom-nav__item" data-rota="mensal" aria-current="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Meses
      </button>
      <button class="bottom-nav__item" data-rota="acumulado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        Acumulado
      </button>
      <button class="bottom-nav__item" data-rota="simulacao">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 12l5-5"/></svg>
        Simulação
      </button>
    </nav>
  </div>

  <!-- Libs externas — só para parsing de PDF e exportação de PDF.
       pdf.js deixou de publicar um build UMD a partir da v4 (só .mjs),
       por isso é carregado como módulo ES dentro de parsers/pdf-text.js
       (import() dinâmico), não aqui. jsPDF ainda publica UMD e continua
       a carregar-se assim, expondo window.jspdf. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script type="module" src="app.js"></script>
</body>
</html>
