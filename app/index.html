<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Antecipa — o seu IRS, um ano antes da hora</title>
  <meta name="description" content="Antecipa: simulação de IRS alinhada com a fórmula oficial, mês a mês, um ano antes da campanha de entrega." />
  <meta name="theme-color" content="#0B1D3A" />
  <!-- Meta tags próprias do iOS (20/10/2026, auditoria de compatibilidade
       entre navegadores/Android/iOS, pedida pelo Dani) — o manifest.json
       já tinha "display": "standalone" e um conjunto completo de ícones,
       mas o Safari do iOS HISTORICAMENTE não lê o modo de visualização
       do manifest.json ao abrir uma app adicionada ao ecrã principal —
       precisa destas tags próprias da Apple para abrir em ecrã inteiro
       (sem a barra de endereço/chrome do Safari) em vez de se comportar
       como um separador normal. apple-mobile-web-app-title define o
       nome mostrado debaixo do ícone no ecrã principal (sem isto, usa o
       <title> completo da página, demasiado comprido). O Android/Chrome
       não precisa disto — já respeita o manifest.json sozinho. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Antecipa" />
  <!-- color-scheme (20/10/2026, mesma auditoria): sem isto, os controlos
       NATIVOS do navegador (setas do <select>, scrollbars, etc.) ficam
       sempre no estilo claro, mesmo com o resto da app já em modo
       escuro (ver @media (prefers-color-scheme: dark) em style.css) —
       mistura visual, mais notória no iOS (o seletor em roda do <select>)
       e no scrollbar do Chrome/Android. "light dark" deixa o motor do
       navegador escolher sozinho conforme prefers-color-scheme, tal
       como a app já faz para o resto das cores. -->
  <meta name="color-scheme" content="light dark" />
  <!-- Content-Security-Policy: reforço recomendado pela auditoria de
       segurança de 04/09/2026 (v2.32 já corrigiu o XSS real encontrado
       nessa auditoria; esta política é defesa em profundidade extra,
       caso alguma sanitização futura falhe). cdnjs.cloudflare.com está
       na lista branca só porque é de onde vêm jsPDF (script clássico) e
       pdf.js (import dinâmico + worker) — ver app/parsers/pdf-text.js e
       o <script> de jsPDF mais abaixo. fonts.googleapis.com/fonts.gstatic.com
       adicionados em 13/10/2026 só para a Fraunces (ver --font-result em
       style.css) — googleapis.com serve o CSS do @font-face (por isso
       style-src), gstatic.com serve o ficheiro da fonte em si (por isso
       font-src). Sem 'unsafe-inline' em nenhuma diretiva: todo o JS/CSS
       da app vive em ficheiros próprios. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; worker-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://cdnjs.cloudflare.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />
  <!-- tema-early.js (20/10/2026, botão de alternar tema — ver
       assets/tema-early.js para a explicação completa): <script>
       clássico, carregado antes do stylesheet para correr antes da 1ª
       pintura e evitar o "flash" do tema errado. Partilhado com a
       landing (../assets/, mesmo ficheiro). -->
  <script src="../assets/tema-early.js"></script>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <!-- Fraunces (13/10/2026, mockups "premium design" aprovados pelo Dani):
       usada SÓ na cifra do .resultado-selo__valor — ver --font-result em
       style.css. --font-display/--font-body/--font-mono continuam todos
       em Inter, isto não é uma mudança de tipografia global. -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-header__row">
        <!-- Sobre o fundo escuro do cabeçalho usa-se a versão em badge
             (fundo claro arredondado) do logotipo, tal como a arte de
             referência mostra para o ícone da app — ver secção 4 do
             BRAND.md. Liga à landing pública (../) — os dados ficam todos
             na IndexedDB do dispositivo, por isso voltar à app depois não
             perde nada, é só navegação. -->
        <a href="../" class="app-header__logo" aria-label="Antecipa — voltar à página inicial">
          <img class="brand-mark" src="../assets/mark-badge.png" alt="" width="44" height="44" />
          <span class="brand-wordmark">antecipa</span>
        </a>
        <!-- Botão de alternar tema (20/10/2026) — ver index.html (landing)
             e app/style.css para a explicação completa. -->
        <button type="button" class="tema-toggle" data-toggle-tema aria-pressed="false" aria-label="Mudar para modo escuro">
          <svg class="tema-toggle__icone tema-toggle__icone--lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          <svg class="tema-toggle__icone tema-toggle__icone--sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <div class="legal-banner" role="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v6M12 7.5h.01"/></svg>
      <span id="legal-banner-texto"></span>
    </div>

    <main class="app-main" id="main-view" aria-live="polite"></main>

    <nav class="bottom-nav" id="bottom-nav" hidden>
      <button class="bottom-nav__item" data-rota="acumulado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        Dashboard
      </button>
      <button class="bottom-nav__item" data-rota="mensal" aria-current="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Meses
      </button>
      <button class="bottom-nav__item" data-rota="deducoes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3v18M4 8h5M4 13h5M4 18h5M15 3v18M15 8h5M15 13h5"/></svg>
        Deduções
      </button>
      <button class="bottom-nav__item" data-rota="simulacao">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 12l5-5"/></svg>
        Simulação
      </button>
      <button class="bottom-nav__item" data-rota="perfil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
        Perfil
      </button>
    </nav>

    <!-- Aviso de nova versão (25/09/2026, pedido do Dani depois de ver
         bugs já corrigidos mas ainda por aparecer no seu Safari — ver
         registarServiceWorker() em app.js): escondido por omissão,
         mostrado via JS só quando há mesmo um service worker novo
         pronto (nunca na primeira instalação). O botão limita-se a
         recarregar a página — o service worker novo já está ativo
         nessa altura (sw.js já faz skipWaiting()+clients.claim()
         sozinho), só falta o browser voltar a pedir os ficheiros. -->
    <div class="update-toast" id="update-toast" hidden role="status">
      <span id="update-toast-texto"></span>
      <button id="update-toast-btn" class="update-toast__btn" type="button"></button>
    </div>
  </div>

  <!-- Libs externas — só para parsing de PDF e exportação de PDF.
       pdf.js deixou de publicar um build UMD a partir da v4 (só .mjs),
       por isso é carregado como módulo ES dentro de parsers/pdf-text.js
       (import() dinâmico), não aqui. jsPDF ainda publica UMD e continua
       a carregar-se assim, expondo window.jspdf.
       integrity: recomendado pela auditoria de 04/09/2026, adicionado
       24/09/2026. O hash foi calculado a partir do pacote jspdf@2.5.1
       descarregado do registo oficial do npm (integridade do próprio
       .tgz confirmada contra o sha512 publicado pelo registo — não foi
       possível descarregar diretamente de cdnjs.cloudflare.com nesta
       sessão, a rede do sandbox bloqueou-o), assumindo que o cdnjs
       espelha o ficheiro dist/ do npm sem modificações (comportamento
       documentado do pipeline de atualização automática do cdnjs a
       partir do npm). Se a exportação de PDF parar de funcionar depois
       deste deploy, o mais provável é este hash — confirmar comparando
       contra o que https://cdnjs.com/libraries/jspdf/2.5.1 mostra num
       browser sem as restrições deste sandbox. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk"
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script type="module" src="app.js"></script>
  <script type="module" src="../assets/tema.js"></script>
</body>
</html>
